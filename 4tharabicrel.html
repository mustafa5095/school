<div id="results-screen" class="hidden">

<footer class="mt-8 pt-4 border-t border-slate-700/60 text-center text-xs text-slate-500">Created by Mustafa Zardasht</footer>

const COLORS=[{bg:"bg-sky-900/60",text:"text-sky-300",border:"border-sky-700"},{bg:"bg-emerald-900/60",text:"text-emerald-300",border:"border-emerald-700"},{bg:"bg-amber-900/60",text:"text-amber-300",border:"border-amber-700"},{bg:"bg-violet-900/60",text:"text-violet-300",border:"border-violet-700"},{bg:"bg-rose-900/60",text:"text-rose-300",border:"border-rose-700"},{bg:"bg-cyan-900/60",text:"text-cyan-300",border:"border-cyan-700"}];
const questions = DATA.questions;
let categoryOrder=[], categoryColor=new Map(), quizQuestions=[], userAnswers=[], currentQuestionIndex=0;
function catKey(q){ return q.category.ku||q.category.en||"—"; }
function prepare(){ categoryOrder=[...new Set(questions.map(catKey))]; categoryColor=new Map(categoryOrder.map((k,i)=>[k,COLORS[i%COLORS.length]])); }
function catLabel(key){ const f=questions.find(q=>catKey(q)===key); return f?pickContent(f.category):key; }
function createQuiz(){ const out=[]; for(const c of categoryOrder){ for(const q of shuffle(questions.filter(x=>catKey(x)===c))){ const order=shuffle(q.optionsKu.map((_,i)=>i)); out.push({category:q.category,categoryKey:c,question:q.question,explanation:q.explanation,optionsKu:order.map(i=>q.optionsKu[i]),optionsEn:order.map(i=>q.optionsEn[i]),correct:order.indexOf(q.correct)}); } } return out; }
function optionAt(q,i){ return contentLang()==="en" ? (q.optionsEn[i]||q.optionsKu[i]||"") : (q.optionsKu[i]||q.optionsEn[i]||""); }
