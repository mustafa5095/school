
<!DOCTYPE html>
<html lang="ku" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title id="page-title">داشبۆردی پەڕەکانی ڕپۆزۆتۆری</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Vazirmatn', sans-serif;
}
button, input, a {
    -webkit-tap-highlight-color: transparent;
}
.file-card {
    animation: fade-in .2s ease-out;
}
@keyframes fade-in {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}
:focus-visible {
    outline: 2px solid #34d399;
    outline-offset: 3px;
}
</style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col p-5 sm:p-10 transition-colors duration-200">

<div class="max-w-5xl w-full mx-auto flex-grow">

    <header class="mb-10 flex flex-col sm:flex-row justify-between items-center gap-6 border-b border-slate-800 pb-6">
        <div class="text-center sm:text-start">
            <h1 id="header-title" class="text-3xl font-bold text-emerald-400 mb-2">
                داشبۆردی پەڕەکانی ڕپۆزۆتۆری
            </h1>
            <p id="header-subtitle" class="text-slate-400 text-sm">
                لیستی سەرجەم فایلە HTMLـەکان بە ڕوونکردنەوە و ناونیشانەوە
            </p>
        </div>

        <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
            <button
                type="button"
                id="lang-btn"
                class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 font-semibold px-4 py-2 rounded-xl text-sm transition w-full sm:w-auto">
                🌐 English
            </button>

            <div class="w-full sm:w-64">
                <input
                    type="search"
                    id="search-input"
                    autocomplete="off"
                    placeholder="گەڕان بەدوای فایلدا..."
                    aria-label="Search HTML files"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition">
            </div>
        </div>
    </header>

    <div class="flex items-center justify-between gap-3 mb-5 text-sm">
        <p id="status-text" class="text-slate-400" role="status" aria-live="polite"></p>

        <button
            type="button"
            id="retry-btn"
            class="hidden text-emerald-400 hover:text-emerald-300 underline underline-offset-4">
            Retry
        </button>
    </div>

    <main id="files-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    </main>

    <div id="empty-state" class="hidden text-center py-16 text-slate-500">
        هیچ فایلێکی HTML نەدۆزرایەوە.
    </div>

</div>

<footer id="footer-text" class="text-center text-xs text-slate-600 mt-12 pt-4 border-t border-slate-800/80">
    پەڕەی سەرەکی ئۆتۆماتیکی • دروستکراوە بە Tailwind CSS
</footer>

<script>
"use strict";

/*
 * Repository dashboard
 *
 * Supported file discovery methods, in priority order:
 * 1. files.json manifest
 * 2. GitHub API for GitHub Pages repositories
 * 3. HTML directory listing, if the server provides one
 * 4. Files declared in description.toml
 *
 * Recommended manifest format:
 * {
 *   "files": ["preview.html", "about.html", "projects/demo.html"]
 * }
 */

const translations = {
    ku: {
        lang: "ku",
        dir: "rtl",
        title: "داشبۆردی پەڕەکانی ڕپۆزۆتۆری",
        subtitle: "لیستی سەرجەم فایلە HTMLـەکان بە ڕوونکردنەوە و ناونیشانەوە",
        searchPlaceholder: "گەڕان بەدوای فایلدا...",
        emptyState: "هیچ فایلێکی HTML نەدۆزرایەوە.",
        noDesc: "هیچ کورتەیەک بۆ ئەم فایلە نەنووسراوە.",
        openBtn: "کردنەوەی پەڕە",
        footer: "پەڕەی سەرەکی ئۆتۆماتیکی • دروستکراوە بە Tailwind CSS",
        nextLangName: "English",
        loading: "تکایە چاوەڕێ بکە...",
        count: n => `${n} فایل`,
        failed: "نەتوانرا لیستی فایلەکان بە تەواوی بدۆزرێتەوە.",
        retry: "هەوڵدانەوە",
        noResults: "هیچ فایلێک لەگەڵ گەڕانەکەت نەگونجا.",
        sourceManifest: "سەرچاوە: files.json",
        sourceGitHub: "سەرچاوە: GitHub",
        sourceDirectory: "سەرچاوە: لیستی بوخچە",
        sourceMetadata: "سەرچاوە: description.toml"
    },
    en: {
        lang: "en",
        dir: "ltr",
        title: "Repository Pages Dashboard",
        subtitle: "Browse HTML files with titles and descriptions",
        searchPlaceholder: "Search files...",
        emptyState: "No HTML files found.",
        noDesc: "No description has been provided for this file.",
        openBtn: "Open Page",
        footer: "Automatic Repository Index • Built with Tailwind CSS",
        nextLangName: "کوردی",
        loading: "Loading files...",
        count: n => `${n} file${n === 1 ? "" : "s"}`,
        failed: "Could not discover all repository files.",
        retry: "Retry",
        noResults: "No files match your search.",
        sourceManifest: "Source: files.json",
        sourceGitHub: "Source: GitHub",
        sourceDirectory: "Source: directory listing",
        sourceMetadata: "Source: description.toml"
    }
};

const DEFAULT_FILES = ["index.html", "preview.html"];

let currentLang = "ku";
let metadata = {};
let fileList = [];
let discoverySource = "";
let loading = false;

const $ = id => document.getElementById(id);

function safeText(value) {
    return typeof value === "string" ? value : "";
}

function normalisePath(path) {
    if (typeof path !== "string") return null;

    path = path.trim().replace(/\\/g, "/");

    if (!path || path.startsWith("/") || path.includes("?") ||
        path.includes("#") || path.includes("\0")) {
        return null;
    }

    const parts = path.split("/");

    if (parts.some(part => !part || part === "." || part === "..")) {
        return null;
    }

    if (!/\.html?$/i.test(path)) return null;

    return path;
}

/*
 * Lightweight TOML parser for common description.toml files.
 *
 * Supports:
 * [filename.html]
 * [files."filename.html"]
 * title = "Example"
 * title_en = "Example"
 * description = "Description"
 *
 * For complex TOML, use JSON metadata instead.
 */
function parseTOML(source) {
    const result = {};
    let section = null;

    function parseValue(raw) {
        raw = raw.trim();

        if (raw.startsWith('"')) {
            try {
                const parsed = JSON.parse(raw);
                return typeof parsed === "string" ? parsed : String(parsed);
            } catch {
                return raw.slice(1, raw.endsWith('"') ? -1 : undefined);
            }
        }

        if (raw.startsWith("'")) {
            const end = raw.lastIndexOf("'");
            return raw.slice(1, end > 0 ? end : undefined);
        }

        return raw;
    }

    for (const originalLine of source.split(/\r?\n/)) {
        const line = originalLine.trim();

        if (!line || line.startsWith("#")) continue;

        const sectionMatch = line.match(/^\[(.+)\]$/);

        if (sectionMatch) {
            let name = sectionMatch[1].trim();

            if (name.startsWith("files.")) {
                name = name.slice(6).trim();
            }

            if (
                (name.startsWith('"') && name.endsWith('"')) ||
                (name.startsWith("'") && name.endsWith("'"))
            ) {
                name = name.slice(1, -1);
            }

            const path = normalisePath(name);

            if (path) {
                section = path;
                result[section] ??= {};
            } else {
                section = null;
            }

            continue;
        }

        if (!section) continue;

        // Find the first equals sign outside quoted strings.
        let quote = "";
        let escaped = false;
        let equalsIndex = -1;

        for (let i = 0; i < line.length; i++) {
            const char = line[i];

            if (escaped) {
                escaped = false;
                continue;
            }

            if (char === "\\" && quote === '"') {
                escaped = true;
                continue;
            }

            if ((char === '"' || char === "'") && !quote) {
                quote = char;
                continue;
            }

            if (char === quote && quote) {
                quote = "";
                continue;
            }

            if (char === "=" && !quote) {
                equalsIndex = i;
                break;
            }
        }

        if (equalsIndex < 0) continue;

        const key = line.slice(0, equalsIndex).trim();

        if (!/^[a-zA-Z0-9_-]+$/.test(key)) continue;

        // Ignore comments outside quoted strings.
        let raw = line.slice(equalsIndex + 1).trim();
        quote = "";
        escaped = false;

        for (let i = 0; i < raw.length; i++) {
            const char = raw[i];

            if (escaped) {
                escaped = false;
                continue;
            }

            if (char === "\\" && quote === '"') {
                escaped = true;
                continue;
            }

            if ((char === '"' || char === "'") && !quote) {
                quote = char;
                continue;
            }

            if (char === quote && quote) {
                quote = "";
                continue;
            }

            if (char === "#" && !quote) {
                raw = raw.slice(0, i).trim();
                break;
            }
        }

        result[section][key] = parseValue(raw);
    }

    return result;
}

async function fetchText(url) {
    const response = await fetch(url, {
        cache: "no-cache"
    });

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${url}`);
    }

    return response.text();
}

async function fetchJSON(url) {
    const text = await fetchText(url);
    return JSON.parse(text);
}

function metadataFiles() {
    return Object.keys(metadata)
        .map(normalisePath)
        .filter(Boolean);
}

function filesFromManifest(data) {
    const files = Array.isArray(data)
        ? data
        : data && Array.isArray(data.files)
            ? data.files
            : [];

    return files.map(normalisePath).filter(Boolean);
}

async function loadMetadata() {
    metadata = {};

    // Prefer JSON metadata if provided.
    try {
        const data = await fetchJSON("./description.json");

        if (data && typeof data === "object" && !Array.isArray(data)) {
            metadata = data.files && typeof data.files === "object"
                ? data.files
                : data;
            return;
        }
    } catch {
        // description.json is optional.
    }

    try {
        metadata = parseTOML(await fetchText("./description.toml"));
    } catch {
        // Metadata is optional.
    }
}

/*
 * GitHub Pages repository detection.
 *
 * User site:
 *   username.github.io/
 *
 * Project site:
 *   username.github.io/repository/
 *
 * This public API lookup needs no token for public repositories.
 */
function getGitHubPagesRepository() {
    const hostname = location.hostname.toLowerCase();

    if (!hostname.endsWith(".github.io")) return null;

    const owner = hostname.slice(0, -".github.io".length);
    const segments = location.pathname.split("/").filter(Boolean);

    const repo = segments.length
        ? segments[0]
        : `${owner}.github.io`;

    return { owner, repo };
}

async function discoverFromGitHub() {
    const repoInfo = getGitHubPagesRepository();

    if (!repoInfo) return null;

    const allFiles = [];
    const perPage = 100;

    // Recursive Git tree returns files in subdirectories too.
    const repository = encodeURIComponent(repoInfo.owner) + "/" +
                       encodeURIComponent(repoInfo.repo);

    const info = await fetchJSON(
        `https://api.github.com/repos/${repository}`
    );

    const tree = await fetchJSON(
        `https://api.github.com/repos/${repository}/git/trees/${encodeURIComponent(info.default_branch)}?recursive=1`
    );

    if (!Array.isArray(tree.tree)) {
        throw new Error("Unexpected GitHub tree response.");
    }

    for (const item of tree.tree) {
        if (item.type !== "blob") continue;

        const path = normalisePath(item.path);

        if (path) allFiles.push(path);
    }

    return allFiles;
}

async function discoverFromDirectory() {
    const html = await fetchText("./");
    const doc = new DOMParser().parseFromString(html, "text/html");
    const files = [];

    for (const link of doc.querySelectorAll("a[href]")) {
        const href = link.getAttribute("href");

        if (!href) continue;

        let url;

        try {
            url = new URL(href, location.href);
        } catch {
            continue;
        }

        // Do not add files from other origins or query-string URLs.
        if (url.origin !== location.origin || url.search || url.hash) {
            continue;
        }

        const currentDir = new URL("./", location.href);

        if (!url.pathname.startsWith(currentDir.pathname)) continue;

        let relativePath = url.pathname.slice(currentDir.pathname.length);

        try {
            relativePath = decodeURIComponent(relativePath);
        } catch {
            continue;
        }

        const path = normalisePath(relativePath);

        if (path) files.push(path);
    }

    return files;
}

function uniqueFiles(files) {
    return [...new Set(files.map(normalisePath).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, undefined, {
            sensitivity: "base"
        }));
}

async function discoverFiles() {
    // 1. Explicit manifest: predictable on any static host.
    try {
        const manifest = await fetchJSON("./files.json");
        const files = filesFromManifest(manifest);

        if (files.length) {
            discoverySource = "manifest";
            return uniqueFiles(files);
        }
    } catch {
        // Manifest is optional.
    }

    // 2. GitHub Pages: discover repository HTML files recursively.
    try {
        const files = await discoverFromGitHub();

        if (files && files.length) {
            discoverySource = "github";
            return uniqueFiles(files);
        }
    } catch (error) {
        console.warn("GitHub API discovery failed:", error);
    }

    // 3. Web servers that expose directory listings.
    try {
        const files = await discoverFromDirectory();

        if (files.length) {
            discoverySource = "directory";
            return uniqueFiles(files);
        }
    } catch {
        // Directory listing is often disabled.
    }

    // 4. Metadata and known default files.
    const fallback = uniqueFiles([
        ...DEFAULT_FILES,
        ...metadataFiles()
    ]);

    discoverySource = "metadata";

    return fallback;
}

function getSourceLabel() {
    const t = translations[currentLang];

    switch (discoverySource) {
        case "manifest": return t.sourceManifest;
        case "github": return t.sourceGitHub;
        case "directory": return t.sourceDirectory;
        default: return t.sourceMetadata;
    }
}

function updateUIStrings() {
    const t = translations[currentLang];

    $("html-root").lang = t.lang;
    $("html-root").dir = t.dir;
    $("page-title").textContent = t.title;
    $("header-title").textContent = t.title;
    $("header-subtitle").textContent = t.subtitle;
    $("search-input").placeholder = t.searchPlaceholder;
    $("search-input").setAttribute("aria-label", t.searchPlaceholder);
    $("empty-state").textContent = t.emptyState;
    $("footer-text").textContent = t.footer;
    $("lang-btn").textContent = `🌐 ${t.nextLangName}`;
    $("retry-btn").textContent = t.retry;

    renderCards($("search-input").value);
}

function getMetadata(file) {
    return metadata[file] || {};
}

function getTitle(file) {
    const meta = getMetadata(file);

    return safeText(
        meta[`title_${currentLang}`] ||
        meta.title ||
        file.split("/").pop()
    );
}

function getDescription(file) {
    const meta = getMetadata(file);

    return safeText(
        meta[`description_${currentLang}`] ||
        meta.description ||
        translations[currentLang].noDesc
    );
}

function makeArrow() {
    const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );

    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "2");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    svg.classList.add("w-4", "h-4");

    if (currentLang === "ku") {
        svg.classList.add("rotate-180");
    }

    const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
    );

    path.setAttribute("d", "M14 5l7 7m0 0l-7 7m7-7H3");
    svg.appendChild(path);

    return svg;
}

function createCard(file) {
    const t = translations[currentLang];

    const card = document.createElement("article");
    card.className =
        "file-card bg-slate-800/80 hover:bg-slate-800 " +
        "border border-slate-700/80 hover:border-emerald-500/50 " +
        "rounded-2xl p-6 transition duration-300 flex flex-col " +
        "justify-between shadow-lg group";

    const top = document.createElement("div");

    const badgeRow = document.createElement("div");
    badgeRow.className = "flex items-center mb-3";

    const badge = document.createElement("span");
    badge.className =
        "text-xs font-mono bg-slate-900 text-emerald-400 " +
        "px-2.5 py-1 rounded-lg border border-slate-700 break-all";
    badge.textContent = file;

    badgeRow.appendChild(badge);

    const title = document.createElement("h2");
    title.className =
        "text-lg font-semibold text-white mb-2 " +
        "group-hover:text-emerald-300 transition break-words";
    title.textContent = getTitle(file);

    const description = document.createElement("p");
    description.className =
        "text-slate-400 text-sm leading-relaxed mb-6 whitespace-pre-line break-words";
    description.textContent = getDescription(file);

    top.append(badgeRow, title, description);

    const actionRow = document.createElement("div");
    actionRow.className =
        "pt-4 border-t border-slate-700/60 flex justify-end";

    const openLink = document.createElement("a");
    openLink.href = file;
    openLink.className =
        "bg-emerald-600 hover:bg-emerald-500 text-white text-sm " +
        "font-semibold px-5 py-2.5 rounded-xl transition shadow-md " +
        "inline-flex items-center gap-2";

    openLink.target = "_blank";
    openLink.rel = "noopener noreferrer";

    openLink.append(
        document.createTextNode(t.openBtn),
        makeArrow()
    );

    actionRow.appendChild(openLink);
    card.append(top, actionRow);

    return card;
}

function renderCards(filterText = "") {
    const grid = $("files-grid");
    const empty = $("empty-state");
    const status = $("status-text");
    const t = translations[currentLang];

    grid.replaceChildren();

    const query = filterText.trim().toLocaleLowerCase();

    const filtered = fileList.filter(file => {
        const searchable = [
            file,
            getTitle(file),
            getDescription(file)
        ].join(" ").toLocaleLowerCase();

        return searchable.includes(query);
    });

    if (loading) {
        empty.classList.add("hidden");
        status.textContent = t.loading;
        return;
    }

    if (filtered.length === 0) {
        empty.textContent = query ? t.noResults : t.emptyState;
        empty.classList.remove("hidden");
    } else {
        empty.classList.add("hidden");

        const fragment = document.createDocumentFragment();

        for (const file of filtered) {
            fragment.appendChild(createCard(file));
        }

        grid.appendChild(fragment);
    }

    status.textContent = `${t.count(filtered.length)} · ${getSourceLabel()}`;
}

function toggleLanguage() {
    currentLang = currentLang === "ku" ? "en" : "ku";

    try {
        localStorage.setItem("dashboard_lang", currentLang);
    } catch {
        // Storage may be unavailable in private or restricted contexts.
    }

    updateUIStrings();
}

async function initDashboard() {
    if (loading) return;

    loading = true;
    $("retry-btn").classList.add("hidden");
    renderCards();

    try {
        await loadMetadata();
        fileList = await discoverFiles();

        // A file list can be empty even if the metadata file exists.
        loading = false;
        updateUIStrings();
    } catch (error) {
        console.error("Dashboard initialization failed:", error);

        fileList = uniqueFiles([
            ...DEFAULT_FILES,
            ...metadataFiles()
        ]);

        discoverySource = "metadata";
        loading = false;
        updateUIStrings();

        $("retry-btn").classList.remove("hidden");
        $("status-text").textContent =
            translations[currentLang].failed;
    }
}

try {
    const savedLanguage = localStorage.getItem("dashboard_lang");

    if (savedLanguage === "ku" || savedLanguage === "en") {
        currentLang = savedLanguage;
    }
} catch {
    // Default to Kurdish.
}

$("lang-btn").addEventListener("click", toggleLanguage);

$("search-input").addEventListener("input", event => {
    renderCards(event.target.value);
});

$("retry-btn").addEventListener("click", initDashboard);

updateUIStrings();
initDashboard();
</script>

</body>
</html>
