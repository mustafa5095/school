<!DOCTYPE html>
<html lang="ku" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">داشبۆردی پەڕەکانی ڕپۆزۆتۆری</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Vazirmatn', sans-serif; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col p-6 sm:p-10 transition-colors duration-200">

<div class="max-w-5xl w-full mx-auto flex-grow">
    <!-- Header -->
    <header class="mb-10 flex flex-col sm:flex-row justify-between items-center gap-6 border-b border-slate-800 pb-6">
        <div class="text-center sm:text-start">
            <h1 id="header-title" class="text-3xl font-bold text-emerald-400 mb-2">داشبۆردی پەڕەکانی ڕپۆزۆتۆری</h1>
            <p id="header-subtitle" class="text-slate-400 text-sm">لیستی سەرجەم فایلە HTMLـەکان بە ڕوونکردنەوە و ناونیشانەوە</p>
        </div>
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
            <!-- Language Switcher Button -->
            <button onclick="toggleLanguage()" id="lang-btn" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 font-semibold px-4 py-2 rounded-xl text-sm transition flex items-center gap-2 w-full sm:w-auto justify-center">
                🌐 English
            </button>
            <!-- Search Bar -->
            <div class="w-full sm:w-64">
                <input type="text" id="search-input" placeholder="گەڕان بەدوای فایلدا..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition">
            </div>
        </div>
    </header>

    <!-- Files Grid Container -->
    <main id="files-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Dynamically populated -->
    </main>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16 text-slate-500">
        هیچ فایلێکی HTML نەدۆزرایەوە.
    </div>
</div>

<footer id="footer-text" class="text-center text-xs text-slate-600 mt-12 pt-4 border-t border-slate-800/80">
    پەڕەی سەرەکی ئۆتۆماتیکی • دروستکراوە بە Tailwind CSS
</footer>

<script>
"use strict";

const translations = {
    ku: {
        dir: 'rtl',
        lang: 'ku',
        title: 'داشبۆردی پەڕەکانی ڕپۆزۆتۆری',
        subtitle: 'لیستی سەرجەم فایلە HTMLـەکان بە ڕوونکردنەوە و ناونیشانەوە',
        searchPlaceholder: 'گەڕان بەدوای فایلدا...',
        emptyState: 'هیچ فایلێکی HTML نەدۆزرایەوە.',
        noDesc: 'هیچ کورتەیەک بۆ ئەم فایلە نەنووسراوە لە description.toml.',
        openBtn: 'کردنەوەی پەڕە',
        footer: 'پەڕەی سەرەکی ئۆتۆماتیکی • دروستکراوە بە Tailwind CSS',
        nextLangName: 'English'
    },
    en: {
        dir: 'ltr',
        lang: 'en',
        title: 'Repository Pages Dashboard',
        subtitle: 'List of all HTML files with titles and descriptions',
        searchPlaceholder: 'Search files...',
        emptyState: 'No HTML files found.',
        noDesc: 'No description provided in description.toml for this file.',
        openBtn: 'Open Page',
        footer: 'Automatic Index Page • Built with Tailwind CSS',
        nextLangName: 'کوردی'
    }
};

let currentLang = localStorage.getItem('dashboard_lang') || 'ku';
let metadata = {};
let fileList = [];

function parseTOML(tomlText) {
    const result = {};
    let currentSection = null;
    const lines = tomlText.split('\n');
    
    for (let line of lines) {
        line = line.trim();
        if (!line || line.startsWith('#')) continue;
        
        const sectionMatch = line.match(/^\[(.*)\]$/);
        if (sectionMatch) {
            let sec = sectionMatch[1].trim().replace(/^["']|["']$/g, '');
            if (sec.startsWith('files.')) sec = sec.replace('files.', '').replace(/^["']|["']$/g, '');
            currentSection = sec;
            result[currentSection] = {};
            continue;
        }
        
        const kvMatch = line.match(/^([a-zA-Z0-9_-]+)\s*=\s*(['"])(.*?)\2$/) \vert{}\vert{} line.match(/^([a-zA-Z0-9_-]+)\s*=\s*(.*)$/);
        if (kvMatch && currentSection) {
            const key = kvMatch[1].trim();
            let val = (kvMatch[3] !== undefined ? kvMatch[3] : kvMatch[2]).trim().replace(/^["']|["']$/g, '');
            result[currentSection][key] = val;
        }
    }
    return result;
}

function updateUIStrings() {
    const t = translations[currentLang];
    document.getElementById('html-root').setAttribute('lang', t.lang);
    document.getElementById('html-root').setAttribute('dir', t.dir);
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('header-title').textContent = t.title;
    document.getElementById('header-subtitle').textContent = t.subtitle;
    document.getElementById('search-input').placeholder = t.searchPlaceholder;
    document.getElementById('empty-state').textContent = t.emptyState;
    document.getElementById('footer-text').textContent = t.footer;
    document.getElementById('lang-btn').innerHTML = `🌐 ${t.nextLangName}`;
}

function toggleLanguage() {
    currentLang = currentLang === 'ku' ? 'en' : 'ku';
    localStorage.setItem('dashboard_lang', currentLang);
    updateUIStrings();
    renderCards(document.getElementById('search-input').value);
}

function renderCards(filterText = '') {
    const gridContainer = document.getElementById('files-grid');
    const emptyState = document.getElementById('empty-state');
    const t = translations[currentLang];
    
    gridContainer.replaceChildren();
    
    const filtered = fileList.filter(file => {
        const meta = metadata[file] || {};
        const title = meta[`title_${currentLang}`] || meta.title || file;
        const desc = meta[`description_${currentLang}`] || meta.description || '';
        const query = filterText.toLowerCase();
        return file.toLowerCase().includes(query) || title.toLowerCase().includes(query) || desc.toLowerCase().includes(query);
    });

    if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
    } else {
        emptyState.classList.add('hidden');
    }

    filtered.forEach(file => {
        const meta = metadata[file] || {};
        const title = meta[`title_${currentLang}`] || meta.title || file; // Reverts to filename if not found
        const description = meta[`description_${currentLang}`] || meta.description || t.noDesc;

        const card = document.createElement('div');
        card.className = "bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 hover:border-emerald-500/50 rounded-2xl p-6 transition duration-300 flex flex-col justify-between shadow-lg group";

        const topContent = document.createElement('div');
        
        const badgeRow = document.createElement('div');
        badgeRow.className = "flex justify-between items-center mb-3";
        
        const fileBadge = document.createElement('span');
        fileBadge.className = "text-xs font-mono bg-slate-900 text-emerald-400 px-2.5 py-1 rounded-lg border border-slate-700";
        fileBadge.textContent = file;
        
        badgeRow.appendChild(fileBadge);

        const titleEl = document.createElement('h2');
        titleEl.className = "text-lg font-semibold text-white mb-2 group-hover:text-emerald-300 transition";
        titleEl.textContent = title;

        const descEl = document.createElement('p');
        descEl.className = "text-slate-400 text-sm leading-relaxed mb-6";
        descEl.textContent = description;

        topContent.append(badgeRow, titleEl, descEl);

        const actionRow = document.createElement('div');
        actionRow.className = "pt-4 border-t border-slate-700/60 flex justify-end";

        const openBtn = document.createElement('a');
        openBtn.href = file;
        openBtn.target = "_blank";
        
        const arrowSvg = currentLang === 'ku' 
            ? `<svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`
            : `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;

        openBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition shadow-md inline-flex items-center gap-2";
        openBtn.innerHTML = `${t.openBtn} ${arrowSvg}`;

        actionRow.appendChild(openBtn);
        card.append(topContent, actionRow);
        gridContainer.appendChild(card);
    });
}

async function initDashboard() {
    try {
        const response = await fetch('description.toml');
        if (response.ok) {
            const tomlText = await response.text();
            metadata = parseTOML(tomlText);
        }
    } catch (e) {
        console.log('description.toml not found, using default filenames.');
    }

    let htmlFiles = new Set(['preview.html', 'index.html']);
    try {
        const response = await fetch('./');
        if (response.ok) {
            const text = await response.text();
            const doc = new DOMParser().parseFromString(text, 'text/html');
            doc.querySelectorAll('a').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.endsWith('.html') && href !== 'index.html') {
                    const filename = href.split('/').pop();
                    if (filename) htmlFiles.add(filename);
                }
            });
        }
    } catch (e) {
        Object.keys(metadata).forEach(file => htmlFiles.add(file));
    }

    fileList = Array.from(htmlFiles);
    
    updateUIStrings();
    renderCards();

    document.getElementById('search-input').addEventListener('input', (e) => renderCards(e.target.value));
}

initDashboard();
</script>
</body>
</html>
