<!DOCTYPE html>
<!--
  STYLE TEMPLATE — the look and feel of this site.
  Copy this file to start any new page (quiz, article, notes, list, anything).
  It is a styling/layout reference, not a quiz.

  How to use (for AI agents and humans):
    1. Copy this file to a new name, e.g. `notes-unit2.html` or `quiz-week3.html`.
    2. Keep the <head>, body classes, card shell, palette and footer exactly as
       they are — that is the shared style.
    3. Replace the content inside the card with whatever the page needs.
    4. Register the page so the dashboard shows it: add the filename to
       `files.json` and add a `["<filename>"]` section to `description.toml`
       with title/title_en, description/description_en and category/category_en.

  Style rules (keep new pages consistent):
    - Tailwind via CDN, no build step.
    - Page shell: `bg-slate-900 text-slate-100`, content in a
      `max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700`.
    - Accent color is emerald (buttons, headings, highlights).
    - Body font is Vazirmatn; layout is RTL, `lang="ku" dir="rtl"`.
    - Build interactive UI with plain DOM APIs (`document.createElement`),
      never `innerHTML`.
    - Always keep the author credit footer at the bottom.

  Palette (Tailwind classes used across the site):
    background   bg-slate-900          card        bg-slate-800
    panel        bg-slate-700/50       border      border-slate-700 / 600
    heading      text-emerald-400      body text   text-slate-100
    muted text   text-slate-400        faint text  text-slate-500
    accent btn   bg-emerald-600 hover:bg-emerald-500
    neutral btn  bg-slate-700 hover:bg-slate-600
    badge        bg-emerald-900/60 text-emerald-300 border-emerald-700
-->

<script>
"use strict";

const $ = id => document.getElementById(id);

/* Convert Western digits in a value to Kurdish digits for display. */
function toKurdishDigits(value) {
  const digits = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  return String(value).replace(/[0-9]/g, digit => digits[Number(digit)]);
}

</script>
